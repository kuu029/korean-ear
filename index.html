<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff6f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="귀트기">
  <meta name="format-detection" content="telephone=no">
  <title>귀트기</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="app"></main>
  <noscript>JavaScript をオンにしてください。</noscript>
  <script type="module" src="js/main.js"></script>
  <!-- 起動できなかったとき（古いファイルが残っているなど）の非常口。記録（localStorage）は消さない -->
  <script>
    setTimeout(function () {
      if (window.__booted) return;
      var el = document.getElementById('app');
      el.innerHTML = '<div style="padding:40px 20px;text-align:center;line-height:1.7">'
        + '<p>アプリを起動できませんでした。<br>記録は消えません。</p>'
        + '<button id="rescue" class="btn primary">読み込み直す</button></div>';
      document.getElementById('rescue').onclick = function () {
        var done = function () { location.replace('./?v=' + Date.now()); };
        var p = [];
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) p.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        if (window.caches) p.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        Promise.all(p).then(done, done);
      };
    }, 8000);
  </script>
</body>
</html>
